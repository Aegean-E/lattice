<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-labelledby="title desc" data-motif="network" data-layout="split">
  <title id="title">Lattice social preview</title>
  <desc id="desc">A provenance-first research knowledge graph for humans and AI agents. Ingest papers, record claims only with an exact quote and locator, link those claims to research questions, and let agents query a deterministic evidence graph instead of a pile of summaries.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#111014"/><stop offset="1" stop-color="#26212b"/></linearGradient>
    <radialGradient id="glow" cx="0.2" cy="0.12" r="0.95"><stop offset="0" stop-color="#e5e7eb" stop-opacity="0.28"/><stop offset="1" stop-color="#e5e7eb" stop-opacity="0"/></radialGradient>
    <linearGradient id="band" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#e5e7eb"/><stop offset="1" stop-color="#f472b6"/></linearGradient>
  </defs>
  <rect width="1280" height="640" fill="url(#bg)"/>
  <rect width="1280" height="640" fill="url(#glow)"/>
  <path d="M0 0H470L300 640H0Z" fill="#e5e7eb" fill-opacity="0.09"/><path d="M470 0L300 640" stroke="#e5e7eb" stroke-opacity="0.30" stroke-width="2"/>
  <g opacity="0.15" stroke="#F8FAFC">
    <path d="M0 128H1280M0 256H1280M0 384H1280M0 512H1280M256 0V640M512 0V640M768 0V640M1024 0V640"/>
  </g>
  <g transform="translate(245 320) scale(1.9)" opacity="1.0"><path d="M-52 24L-18 -42L20 34L54 -14M20 34L48 44M-18 -42L-44 -34" fill="none" stroke="#e5e7eb" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><circle cx="-52" cy="24" r="8" fill="#e5e7eb"/><circle cx="-18" cy="-42" r="8" fill="#e5e7eb"/><circle cx="20" cy="34" r="8" fill="#e5e7eb"/><circle cx="54" cy="-14" r="8" fill="#e5e7eb"/><circle cx="48" cy="44" r="8" fill="#e5e7eb"/><circle cx="-44" cy="-34" r="8" fill="#e5e7eb"/></g>
  <text x="548" y="246" font-family="Segoe UI, Arial, sans-serif" font-size="76" font-weight="700" fill="#F8FAFC">Lattice</text><text x="550" y="292" font-family="Segoe UI, Arial, sans-serif" font-size="21" letter-spacing="5" fill="#e5e7eb">AEGEANWORKS · CLI</text>
  <text x="550" y="344" font-family="Segoe UI, Arial, sans-serif" font-size="28" fill="#F8FAFC" fill-opacity="0.74">A provenance-first research knowledge graph for</text><text x="550" y="386" font-family="Segoe UI, Arial, sans-serif" font-size="28" fill="#F8FAFC" fill-opacity="0.74">humans and AI agents. Ingest papers, record claims</text><text x="550" y="428" font-family="Segoe UI, Arial, sans-serif" font-size="28" fill="#F8FAFC" fill-opacity="0.74">only with an exact quote and locator, link those</text>
  <rect x="550" y="500" width="76" height="38" rx="19" fill="#0B1220" fill-opacity="0.55" stroke="#94A3B8" stroke-opacity="0.35"/><text x="588.0" y="525" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#F8FAFC" fill-opacity="0.82">aikit</text><rect x="678" y="500" width="116" height="38" rx="19" fill="#0B1220" fill-opacity="0.55" stroke="#94A3B8" stroke-opacity="0.35"/><text x="736.0" y="525" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#F8FAFC" fill-opacity="0.82">ai agents</text><rect x="906" y="500" width="166" height="38" rx="19" fill="#0B1220" fill-opacity="0.55" stroke="#94A3B8" stroke-opacity="0.35"/><text x="989.0" y="525" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#F8FAFC" fill-opacity="0.82">evidence graph</text>
